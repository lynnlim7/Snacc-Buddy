[project]
name = "snacc-buddy-backend"
version = "0.1.0"
description = "Snacc Buddy API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "google-genai>=1.0.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "email-validator>=2.3.0",
    "fastapi-mail>=1.6.4",
    "tenacity>=9.0.0",
    "redis[asyncio]>=5.0.0",
    "fastapi-limiter>=0.1.6",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "ipython>=8.39.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
